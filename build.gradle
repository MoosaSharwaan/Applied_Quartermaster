plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.134'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = 'appliedquartermaster'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neoforge_version

    mods {
        appliedquartermaster {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
        // Development self-test: builds a test network in the world "aqtest", screenshots every tablet page, quits.
        selftest {
            client()
            systemProperty 'appliedquartermaster.selftest', 'true'
            programArguments.addAll('--quickPlaySingleplayer', 'aqtest', '--width', '1920', '--height', '1080')
        }
    }
}

repositories {
    mavenCentral()
    maven {
        // Applied Energistics 2, GuideME and AE2 Wireless Terminals
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
    }
}

dependencies {
    implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    implementation "org.appliedenergistics:guideme:${guideme_version}"
    compileOnly("de.mari_023:ae2wtlib_api:${ae2wtlib_version}") { transitive = false }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version         : neoforge_version, neo_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
